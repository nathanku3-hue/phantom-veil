name: Python CI

on:
  push:
    branches: [ main, mvp-001-worldgen ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@82c7e631dfb92742d734187913cf712857d50c4a # v5.1.0
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: Run Ruff Format Check
        run: python -m ruff format --check .

      - name: Run Ruff Lint Check
        run: python -m ruff check .

      - name: Run Pytest
        run: python -m pytest
